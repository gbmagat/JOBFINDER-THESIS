worker_processes 1;
pid /tmp/jobfinder-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 6m;
    client_body_temp_path /tmp/jobfinder-client;
    proxy_temp_path /tmp/jobfinder-proxy;
    fastcgi_temp_path /tmp/jobfinder-fastcgi;
    uwsgi_temp_path /tmp/jobfinder-uwsgi;
    scgi_temp_path /tmp/jobfinder-scgi;
    server {
        listen 8080;
        server_name _;
        root /app/dist;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:3210;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location ~ (^|/)\. { return 404; }
        location ~* ^/(server|uploads?|backups?)(/|$) { return 404; }
        location ~* \.(sqlite3?|db|wal|shm|env|pem|key)$ { return 404; }
        location /assets/ { try_files $uri =404; }
        location /data/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
