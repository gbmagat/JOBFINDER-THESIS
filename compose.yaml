services:
  jobfinder:
    image: gabmagat/jobfinder:latest
    ports:
      # Evaluation is local-only. Do not expose plain HTTP to the internet.
      - "127.0.0.1:8080:8080"
    environment:
      JOBFINDER_APP_ORIGIN: http://localhost:8080
      JOBFINDER_MAIL_PROVIDER: none
      JOBFINDER_NOTIFICATIONS_ENABLED: "0"
    volumes:
      - jobfinder-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

volumes:
  jobfinder-data:
